name: Gate image

# Publishes ghcr.io/<owner>/homelib-gate, the iroh gate docker-compose.yml runs under the
# `iroh` profile.
#   master  → :latest and :sha-<short>
#   v1.2.3  → :1.2.3 and :1.2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "tunnel/**"
      - "!tunnel/**/*.md"
      - ".github/workflows/gate-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: gate-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homelib-gate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 only: the Rust build under QEMU for arm64 takes the better part of an hour.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tunnel
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARGO_BUILD_JOBS=4
          cache-from: type=gha,scope=gate
          cache-to: type=gha,scope=gate,mode=max

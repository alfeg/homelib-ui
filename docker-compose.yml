services:
  torrserve:
    image: ghcr.io/yourok/torrserver:latest
    restart: unless-stopped
    ports:
      - "8090"
    volumes:
      - torrserve_data:/opt/torrserver

  meilisearch:
    image: getmeili/meilisearch:v1.24
    restart: unless-stopped
    ports:
      - "7701:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-homelib-local-dev-master-key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # Indexing 586k documents is the memory spike, not steady-state serving.
      MEILI_MAX_INDEXING_MEMORY: 512Mb
      MEILI_MAX_INDEXING_THREADS: 2
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  myhomelib:
    # The published image by default; `docker compose up --build` builds from source instead.
    image: ghcr.io/alfeg/homelib-ui:${HOMELIB_TAG:-latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      Torrent__TorrServeUrl: http://torrserve:8090

      # The library this instance serves. Required — clients cannot supply a magnet.
      Library__MagnetUri: ${LIBRARY_MAGNET_URI:?set LIBRARY_MAGNET_URI in .env}
      Library__Title: ${LIBRARY_TITLE:-MyHomeLib}

      Meili__Url: http://meilisearch:7700
      Meili__MasterKey: ${MEILI_MASTER_KEY:-homelib-local-dev-master-key}
      Meili__IndexUid: books

      DOTNET_gcServer: 0
      DOTNET_GCHeapHardLimitPercent: 35
      DOTNET_GCConserveMemory: 9
      DOTNET_GCRetainVM: 0

  # Optional: reach the server over iroh, e.g. from the PocketBook app, with no open port
  # and without revealing the home address. Enable with `docker compose --profile iroh up -d`;
  # clients use the ticket from `docker compose --profile iroh run --rm iroh-gate ticket`
  # (add `--no-relay` for a LAN-only ticket). See tunnel/README.md.
  iroh-gate:
    profiles: ["iroh"]
    image: ghcr.io/alfeg/homelib-gate:${HOMELIB_TAG:-latest}
    build: ./tunnel
    restart: unless-stopped
    depends_on:
      - myhomelib
    # Direct connections from devices on the home network (no relay needed there).
    ports:
      - "${HOMELIB_GATE_PORT:-11204}:${HOMELIB_GATE_PORT:-11204}/udp"
    environment:
      HOMELIB_GATE_SECRET: ${HOMELIB_GATE_SECRET:?set HOMELIB_GATE_SECRET (homelib-gate keygen)}
      HOMELIB_TUNNEL_TOKEN: ${HOMELIB_TUNNEL_TOKEN:?set HOMELIB_TUNNEL_TOKEN (same as the relay token)}
      # Optional: without a relay the gate is reachable on the LAN only.
      HOMELIB_RELAY_URL: ${HOMELIB_RELAY_URL:-}
      HOMELIB_UPSTREAM: myhomelib:8080
      HOMELIB_GATE_PORT: ${HOMELIB_GATE_PORT:-11204}
      # This machine's LAN address and the port above, e.g. 192.168.1.10:11204. Optional.
      HOMELIB_GATE_DIRECT: ${HOMELIB_GATE_DIRECT:-}

volumes:
  torrserve_data:
  meili_data:
